[package]
name = "burnlings-cli"
version = "0.1.0"
edition = "2024"
description = "Exercise runner for burnlings — run the next unsolved exercise without typing its name"
publish = false

# The runner deliberately does NOT depend on `burn`: it shells out to cargo, so
# it builds in seconds and stays usable while an exercise doesn't compile.
[[bin]]
name = "burnlings"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
